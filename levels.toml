# The OSM admin_level each country is divided at for download. A country not
# listed takes `default`. A country that comes out badly is fixed by one line
# here, with the reason in the commit message. A list of levels takes the
# first, then whatever each later one adds that the earlier left uncovered.
default = 4

[levels]
gr = 6
# Cyprus has nothing at level 4 and came out as one region. Level 6 is the
# fifty municipalities and community clusters of the 2024 reform, too fine
# for a picker; level 5 is the districts (Nicosia, Limassol, Larnaca, Paphos,
# Famagusta, and those OSM maps in the north), eleven in all.
cy = 5
# Portugal's level 4 is only Azores and Madeira, so at the default 94% of its
# places fell in no region. Its eighteen districts are at level 6; the islands
# are then added from level 4.
pt = [6, 4]
# Slovenia has nothing at levels 4 to 6 that closes: of its 58 administrative
# units at level 7 only eleven do, and its 212 municipalities at level 8 are
# too many for a picker. It is small enough to be one region.
si = 2
